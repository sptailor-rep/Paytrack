<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Participation & Payments</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#222}
.app{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 24px;font-size:26px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:28px;margin-bottom:8px}
.section-title h2{margin:0;font-size:19px}
.count{font-weight:700;color:#666}
.player{display:grid;grid-template-columns:88px 1fr 96px;gap:10px;align-items:center;min-height:60px;border-bottom:1px solid #e5e5e5}
.player-name{font-size:17px;overflow-wrap:anywhere}
button{border:0;border-radius:9px;padding:10px 8px;font-size:14px;font-weight:800;cursor:pointer}
.paid-btn{background:#8e8e93;color:#fff}
.paid-btn.is-paid{background:#34c759}
.player.is-paid .player-name{opacity:.55;text-decoration:line-through}
.move-btn{background:#007aff;color:#fff}
.move-btn.demote{background:#ff9500}
.summary{margin-top:26px;padding:14px 16px;border-radius:10px;background:#f1f1f1;font-weight:700}
.actions{display:flex;gap:10px;margin-top:14px}
.secondary{flex:1;background:#e9e9e9;color:#222}
@media(max-width:480px){
  .player{grid-template-columns:78px 1fr 90px;gap:8px}
  button{font-size:13px;padding:10px 6px}
  .player-name{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <h1>Soccer Participation & Payments</h1>

  <div class="section-title">
    <h2>IN</h2>
    <span class="count" id="in-count">0</span>
  </div>
  <div id="in-list"></div>

  <div class="section-title">
    <h2>STANDBY</h2>
    <span class="count" id="standby-count">0</span>
  </div>
  <div id="standby-list"></div>

  <div class="summary" id="summary"></div>

  <div class="actions">
    <button class="secondary" id="reset-btn" type="button">Reset all</button>
  </div>
</div>

<script>
const STORAGE_KEY='soccer-participation-payments-v1';
const DEFAULT_PLAYERS=[{"name": "Sagar T", "group": "in", "paid": true}, {"name": "Kojo", "group": "in", "paid": false}, {"name": "Mahesh Sir ⚽️", "group": "in", "paid": false}, {"name": "Pratik", "group": "in", "paid": false}, {"name": "Gyan", "group": "standby", "paid": false}, {"name": "Rohit", "group": "standby", "paid": false}];
let players=loadPlayers();

function loadPlayers(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return DEFAULT_PLAYERS.map(p=>({...p}));
}

function savePlayers(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(players));}catch(e){}
}

function togglePaid(name){
  const p=players.find(x=>x.name===name);
  if(!p) return;
  p.paid=!p.paid;
  savePlayers();
  render();
}

function toggleGroup(name){
  const p=players.find(x=>x.name===name);
  if(!p) return;
  p.group=p.group==='in'?'standby':'in';
  savePlayers();
  render();
}

function createPlayerRow(player){
  const row=document.createElement('div');
  row.className='player'+(player.paid?' is-paid':'');

  const paid=document.createElement('button');
  paid.type='button';
  paid.className='paid-btn'+(player.paid?' is-paid':'');
  paid.textContent='PAID';
  paid.addEventListener('click',()=>togglePaid(player.name));

  const name=document.createElement('span');
  name.className='player-name';
  name.textContent=player.name;

  const move=document.createElement('button');
  move.type='button';
  if(player.group==='in'){
    move.className='move-btn demote';
    move.textContent='DEMOTE';
  }else{
    move.className='move-btn';
    move.textContent='PROMOTE';
  }
  move.addEventListener('click',()=>toggleGroup(player.name));

  row.append(paid,name,move);
  return row;
}

function render(){
  const inList=document.getElementById('in-list');
  const standbyList=document.getElementById('standby-list');
  inList.innerHTML='';
  standbyList.innerHTML='';

  const ins=players.filter(p=>p.group==='in');
  const stands=players.filter(p=>p.group==='standby');

  ins.forEach(p=>inList.appendChild(createPlayerRow(p)));
  stands.forEach(p=>standbyList.appendChild(createPlayerRow(p)));

  document.getElementById('in-count').textContent=ins.length;
  document.getElementById('standby-count').textContent=stands.length;

  const paidCount=ins.filter(p=>p.paid).length;
  document.getElementById('summary').textContent=
    `Payments received: ${paidCount} of ${ins.length} confirmed players`;
}

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(!confirm('Reset all payment statuses and player positions?')) return;
  players=DEFAULT_PLAYERS.map(p=>({...p}));
  savePlayers();
  render();
});

render();
</script>
</body>
</html>
